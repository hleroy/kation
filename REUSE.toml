version = 1
SPDX-PackageName = "Kation"
SPDX-PackageDownloadLocation = "https://github.com/hleroy/kation"

# Modules copied from the Proton Drive CLI. Kation's changes to them are
# released under the same MIT license to keep upstream merges simple.
[[annotations]]
path = "daemon/src/proton/**"
precedence = "override"
SPDX-FileCopyrightText = ["2025-2026 Proton AG", "2026 Kation contributors"]
SPDX-License-Identifier = "MIT"

# Files that cannot carry a comment header.
[[annotations]]
path = ["README.md", "DEVNOTES.md", "ROADMAP.md", "SECURITY.md", ".gitmodules", "daemon/.bun-version", "daemon/package.json", "daemon/bun.lock", "daemon/tsconfig.json", "kde/**/*.json", "packaging/copyright", "CHANGELOG.md", "CLAUDE.md", ".claude/settings.json", ".github/pull_request_template.md"]
SPDX-FileCopyrightText = "2026 Kation contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Translations: xgettext writes its own header comments into these files.
[[annotations]]
path = ["po/kation.pot", "po/*/kation.po"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Kation contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"
