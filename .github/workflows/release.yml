# A version tag (vX.Y.Z) builds the packages and publishes them in a GitHub
# release, with the version's CHANGELOG.md section as release notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The package jobs do not run lint or ctest: a commit on main passed them
      # in its pull request and in the push to main.
      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main: tag the release commit after it is merged."
            exit 1
          fi
      - name: Match the tag with CMakeLists.txt and CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^project(kation VERSION \([^ ]*\) .*/\1/p' CMakeLists.txt)"
          if [ "$version" != "$project_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project(VERSION) $project_version in CMakeLists.txt."
            exit 1
          fi
          if ! grep -q "^## \[$version\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version] - YYYY-MM-DD' section."
            exit 1
          fi

  packages:
    name: Packages
    needs: check
    uses: ./.github/workflows/packages.yml

  release:
    name: GitHub release
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Build provenance: a signing certificate for this workflow, and the attestation store.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kation-*
          path: dist
          merge-multiple: true
      # Before SHA256SUMS exists: only the packages are attested.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Write the checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          files="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          {
            # The version's section, without the link definitions at the end of
            # the file. Relative links would resolve against the release page.
            awk -v header="## [$version] - " '
              index($0, header) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found && !/^\[[^]]*\]: / { print }
            ' CHANGELOG.md | sed -E "s|\]\(([^)#:/][^):]*)\)|](${files}/\1)|g"
            cat <<'EOF'

          ### Packages

          - `.deb`: Debian 13 (it does not install on older bases such as Ubuntu 24.04).
          - `.rpm`: Fedora 43.
          - `.pkg.tar.zst`: Arch Linux.

          Each package depends on the library versions of its distribution. For
          another distribution or version, build one with `./build-package.sh`
          (see DEVNOTES.md).

          ### Verify

          Check a downloaded package against the checksums, and that it was built
          by this repository's Release workflow:

          ```sh
          sha256sum -c SHA256SUMS --ignore-missing
          gh attestation verify <package file> --repo hleroy/kation
          ```
          EOF
          } > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "Kation ${GITHUB_REF_NAME#v}" --notes-file notes.md
